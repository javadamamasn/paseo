name: Fork Android Debug APK

# Fork-local visual loop: builds an installable debug APK directly with Gradle
# (no EAS, no signing keys, no paid worker). Debug APKs skip the Hermes AOT
# compile that OOM-kills medium EAS workers (exit 137), so this fits the free
# GitHub runner. Trigger manually: Actions -> Fork Android Debug APK -> Run.
on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || echo "licenses already accepted"

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
        working-directory: .

      - name: Expo prebuild (production variant)
        run: npx cross-env APP_VARIANT=production expo prebuild --platform android --clean --non-interactive

      - name: Side-by-side install (fork suffix + label)
        run: |
          python3 - <<'EOF'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          bt = re.search(r"buildTypes\s*\{", s)
          assert bt, "buildTypes block not found"
          dbg = re.search(r"debug\s*\{", s[bt.end():])
          assert dbg, "debug buildType not found"
          at = bt.end() + dbg.end()
          s = s[:at] + '\n            applicationIdSuffix ".debug"\n            versionNameSuffix "-fork"' + s[at:]
          open(p, "w").write(s)
          EOF
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Paseo Fork</string>|' android/app/src/main/res/values/strings.xml
          grep -n "applicationIdSuffix\|Paseo Fork" android/app/build.gradle android/app/src/main/res/values/strings.xml | head -4

      - name: Gradle assembleDebug (arm64 only, smaller download)
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: packages/app/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paseo-fork-debug-apk
          path: packages/app/android/app/build/outputs/apk/debug/app-debug.apk
